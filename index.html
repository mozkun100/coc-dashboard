<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة الرمي — Silvester Augustin</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #2b2118;
    font-family: 'Amiri', serif;
    color: #2a1d12;
  }
  .paper {
    max-width: 560px; margin: 0 auto;
    background: #efe2c4;
    border: 1px solid #b99c6b;
    padding: 20px 18px 28px;
    box-shadow: 0 0 0 6px #e3d3ae, 0 10px 30px rgba(0,0,0,.5);
  }
  .en { font-family: 'Special Elite', monospace; direction: ltr; unicode-bidi: isolate; }
  h1 { margin: 0; font-size: 26px; text-align: center; }
  .sub { text-align: center; color: #6b5338; font-size: 15px; margin-bottom: 14px; }
  hr { border: none; border-top: 1px dashed #9c7f55; margin: 16px 0; }
  label { font-size: 15px; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px; font-size: 14px;
    background: #f7eedb; border: 1px solid #9c7f55; color: #2a1d12;
    direction: ltr; font-family: monospace;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    font-family: inherit; cursor: pointer;
    background: #f7eedb; color: #2a1d12;
    border: 1px solid #6b5338; padding: 10px 12px; font-size: 16px;
  }
  button:active { transform: scale(.97); }
  .btn-dark { background: #3b2a1c; color: #efe2c4; border-color: #3b2a1c; }
  .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .skill { display: flex; justify-content: space-between; align-items: center; direction: ltr; gap: 10px; }
  .skill .num { border-right: none; padding: 0 0 0 8px; border-left: 1px dashed #9c7f55; }
  .skill .num { font-family: 'Special Elite', monospace; font-size: 18px; }
  .result {
    margin-top: 16px; padding: 14px; text-align: center;
    border: 2px solid #3b2a1c; background: #f7eedb; min-height: 90px;
  }
  .roll { font-family: 'Special Elite', monospace; font-size: 40px; line-height: 1.1; }
  .lvl { font-size: 20px; font-weight: 700; }
  .ok { color: #2f5d2a; } .bad { color: #8a1f1f; }
  .status { font-size: 14px; margin-top: 8px; color: #6b5338; }
  .chars { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .chars button.on { background: #3b2a1c; color: #efe2c4; }
  .hint { font-size: 13px; color: #6b5338; margin-top: 6px; }
</style>
</head>
<body>
<div class="paper">
  <div class="chars" id="chars"></div>
  <h1 class="en" id="charName">Silvester Augustin</h1>
  <div class="sub" id="charSub"></div>

  <label>رابط الـ Webhook (ينحفظ في جهازك بس)</label>
  <input id="hook" placeholder="https://discord.com/api/webhooks/..." autocomplete="off">
  <div class="row">
    <button class="btn-dark" id="save">احفظ الرابط</button>
    <button id="ping">أرسل رسالة تجربة</button>
  </div>
  <div class="hint" id="hookState"></div>

  <hr>
  <label>اضغط على مهارة عشان ترمي <span class="en">1D100</span></label>
  <div class="skills" id="skills"></div>

  <div class="result" id="result">
    <div class="status">ما رميت شي للحين</div>
  </div>
</div>

<script>
const CHARACTERS = {
  silvester: {
    name: 'Silvester Augustin',
    sub: 'ساحر هروب · بوسطن',
    skills: [
      ['Locksmith', 66], ['Spot Hidden', 65], ['Listen', 50],
      ['Psychology', 50], ['Charm', 40], ['Persuade', 40],
      ['Brawl', 25], ['Luck', 70], ['Sanity', 60]
    ]
  },
  eleanor: {
    name: 'Eleanor Whitlock',
    sub: 'صحفية · أركهام (شخصية تجربة)',
    skills: [
      ['Library Use', 70], ['Spot Hidden', 60], ['Fast Talk', 50],
      ['Photography', 50], ['Psychology', 45], ['Persuade', 45],
      ['Dodge', 35], ['Luck', 50], ['Sanity', 55]
    ]
  }
};
let current = 'silvester';
let NAME = CHARACTERS[current].name;

const hookEl = document.getElementById('hook');
const hookState = document.getElementById('hookState');
const resultEl = document.getElementById('result');

function getHook() {
  try { return localStorage.getItem('coc_hook') || ''; } catch (e) { return ''; }
}
function setHook(v) {
  try { localStorage.setItem('coc_hook', v); } catch (e) {}
}
function showHookState() {
  const h = getHook();
  hookState.textContent = h ? 'الرابط محفوظ ✔' : 'ما فيه رابط محفوظ للحين';
  if (h) hookEl.value = h;
}

document.getElementById('save').onclick = () => {
  const v = hookEl.value.trim();
  if (!/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(v)) {
    hookState.textContent = 'الرابط غلط — لازم يبدأ بـ https://discord.com/api/webhooks/';
    return;
  }
  setHook(v); showHookState();
};

function level(roll, skill) {
  const fumble = skill < 50 ? roll >= 96 : roll === 100;
  if (roll === 1) return ['نجاح حرج', 'Critical', true];
  if (fumble) return ['فشل ذريع', 'Fumble', false];
  if (roll <= Math.floor(skill / 5)) return ['نجاح متطرف', 'Extreme Success', true];
  if (roll <= Math.floor(skill / 2)) return ['نجاح صعب', 'Hard Success', true];
  if (roll <= skill) return ['نجاح عادي', 'Regular Success', true];
  return ['فشل', 'Failure', false];
}

async function post(h, content, who) {
  const r = await fetch(h, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: who || NAME, content, flags: 4096 })
  });
  if (r.ok) return { ok: true };
  if (r.status === 429) return { ok: false, code: 429, retry: true };
  let detail = '';
  try { detail = await r.text(); } catch (e) {}
  return { ok: false, code: r.status, detail };
}

async function send(content, plain, who) {
  const h = getHook();
  if (!h) return 'nohook';
  try {
    let res = await post(h, content, who);
    for (let i = 0; i < 3 && res.retry; i++) {
      await new Promise(ok => setTimeout(ok, 1500));
      res = await post(h, content, who);
    }
    if (!res.ok && res.code === 400 && plain) {
      const res2 = await post(h, plain, who);
      if (res2.ok) return 'ok';
      res = res2;
    }
    if (res.ok) return 'ok';
    lastDetail = res.detail;
    return 'err' + res.code;
  } catch (e) { return 'neterr'; }
}
let lastDetail = '';

function statusText(s) {
  if (s === 'ok') return 'وصلت للدسكورد ✅';
  if (s === 'nohook') return 'ما وصلت — حط رابط الـ Webhook واحفظه فوق';
  if (s === 'neterr') return 'ما وصلت ❌ — مشكلة اتصال أو المتصفح منعها';
  return 'ما وصلت ❌ — الدسكورد رفض (' + s.replace('err', '') + ') ' + (lastDetail || '').slice(0, 200);
}

document.getElementById('ping').onclick = async () => {
  const s = await send('🔔 تجربة اتصال من داشبورد سلفستر');
  hookState.textContent = statusText(s);
};

const box = document.getElementById('skills');
const charsEl = document.getElementById('chars');

function pickChar(key) {
  current = key;
  NAME = CHARACTERS[key].name;
  try { sessionStorage.setItem('coc_char', key); } catch (e) {}
  document.getElementById('charName').textContent = NAME;
  document.getElementById('charSub').textContent = CHARACTERS[key].sub;
  document.title = 'داشبورد — ' + NAME;
  charsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.key === key));
  resultEl.innerHTML = '<div class="status">ما رميت شي للحين</div>';
  renderSkills();
}

Object.keys(CHARACTERS).forEach(key => {
  const b = document.createElement('button');
  b.dataset.key = key;
  b.className = 'en';
  b.textContent = CHARACTERS[key].name;
  b.onclick = () => pickChar(key);
  charsEl.appendChild(b);
});

function renderSkills() {
  box.innerHTML = '';
  CHARACTERS[current].skills.forEach(([name, val]) => {
    const b = document.createElement('button');
    b.className = 'skill';
    b.innerHTML = '<span class="en">' + name + '</span><span class="num">' + val + '</span>';
    b.onclick = async () => {
      const who = NAME;
      const roll = Math.floor(Math.random() * 100) + 1;
      const [ar, en, good] = level(roll, val);
      resultEl.innerHTML =
        '<div class="en" style="font-size:16px">' + name + ' (' + val + ')</div>' +
        '<div class="roll">' + roll + '</div>' +
        '<div class="lvl ' + (good ? 'ok' : 'bad') + '">' + ar + ' · <span class="en">' + en + '</span></div>' +
        '<div class="status">جاري الإرسال…</div>';
      const msg = '🎲 **' + name + '** (' + val + ') → **' + roll + '** — ' +
        (good ? '✅ ' : '❌ ') + ar + ' / ' + en;
      const plain = name + ' (' + val + '): ' + roll + ' - ' + en;
      const s = await send(msg, plain, who);
      resultEl.querySelector('.status').textContent = statusText(s);
    };
    box.appendChild(b);
  });
}

let startKey = 'silvester';
const fromHash = location.hash.replace('#', '');
let saved = '';
try { saved = sessionStorage.getItem('coc_char') || ''; } catch (e) {}
if (CHARACTERS[fromHash]) startKey = fromHash;
else if (CHARACTERS[saved]) startKey = saved;
pickChar(startKey);

showHookState();
</script>
</body>
</html>
